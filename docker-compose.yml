services:
  ytcookies:
    build: .
    container_name: ytcookies
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "8300:8300"
    volumes:
      - ./data:/data
      - /lib/modules:/lib/modules:ro
    env_file:
      - .env
    networks:
      - ytcookies

networks:
  ytcookies:
    driver: bridge
    ipam:
      config:
        # Must NOT overlap the WireGuard subnet 10.99.0.0/20
        - subnet: 172.33.0.0/16
